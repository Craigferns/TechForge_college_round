[project]
name = "agentbreak"
version = "0.1.0"
description = "Autonomous security-testing platform for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "agentdojo==0.1.35",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "types-pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/agentbreak"]

[tool.hatch.build.targets.wheel.sources]
"backend/agentbreak" = "agentbreak"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "ollama: marks tests requiring local Ollama server (deselect with '-m \"not ollama\"')",
    "e2e: marks end-to-end integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_subclassing_any = false
no_implicit_optional = true
mypy_path = "backend"

[[tool.mypy.overrides]]
module = "agentbreak.domain.*"
strict = true

[[tool.mypy.overrides]]
module = "agentbreak.schemas.*"
strict = true

[[tool.mypy.overrides]]
module = "agentdojo.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "agentbreak.sandbox.acme.user_tasks",
    "agentbreak.sandbox.acme.injection_tasks",
    "agentbreak.sandbox.policy_runtime",
    "agentbreak.targets.scripted",
]
disable_error_code = ["misc"]
